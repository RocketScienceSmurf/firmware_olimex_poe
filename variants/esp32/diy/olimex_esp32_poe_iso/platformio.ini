; Olimex ESP32-POE-ISO + MOD-LoRa868 (SX1276 on UEXT)
[env:olimex-esp32-poe-iso]
custom_meshtastic_hw_model = 39
custom_meshtastic_hw_model_slug = DIY_V1
custom_meshtastic_architecture = esp32
custom_meshtastic_actively_supported = false
custom_meshtastic_support_level = 4
custom_meshtastic_display_name = Olimex ESP32-POE-ISO
custom_meshtastic_tags = DIY

extends = esp32_base
board = esp32-poe-iso
board_check = true
build_flags =
  ${esp32_base.build_flags}
  -D DIY_V1
  -I variants/esp32/diy/olimex_esp32_poe_iso
  -ULED_BUILTIN
