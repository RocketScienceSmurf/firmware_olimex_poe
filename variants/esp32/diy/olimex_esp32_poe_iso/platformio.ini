; Olimex ESP32-POE-ISO + Olimex MOD-LoRa868/915 (SX1276)
; Plug the MOD-LoRa868 (or MOD-LoRa915) directly into the ESP32-POE-ISO UEXT port.
;
; NOTE: LAN8720 Ethernet is NOT supported in Meshtastic firmware for RMII PHYs.
; NOTE: I2C, UART via UEXT are unavailable - those pins are used by the LoRa module.
[env:olimex-esp32-poe-iso]
extends = esp32_base
board = esp32-poe-iso
board_level = extra
board_build.partitions = variants/esp32/diy/olimex_esp32_poe_iso/partitions.csv
board_build.filesystem_dir = variants/esp32/diy/olimex_esp32_poe_iso/data
build_src_filter =
  ${esp32_base.build_src_filter}
  +<mesh/eth/lan8720Client.cpp>

build_flags =
  ${esp32_base.build_flags}
  -D DIY_V1
  -I variants/esp32/diy/olimex_esp32_poe_iso
  -ULED_BUILTIN
  -D MESHTASTIC_EXCLUDE_I2C=1
  -D MESHTASTIC_EXCLUDE_GPS=1
  -D MESHTASTIC_EXCLUDE_SCREEN=1
  -D MESHTASTIC_EXCLUDE_AUDIO=1
  -D MESHTASTIC_EXCLUDE_DETECTIONSENSOR=1
  -D MESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR=1
  -D MESHTASTIC_EXCLUDE_AIR_QUALITY_SENSOR=1
  -D MESHTASTIC_EXCLUDE_HEALTH_TELEMETRY=1
  -D MESHTASTIC_EXCLUDE_EXTERNALNOTIFICATION=1
  -D MESHTASTIC_EXCLUDE_PAXCOUNTER=1
  -D MESHTASTIC_EXCLUDE_POWER_TELEMETRY=1
  -D MESHTASTIC_EXCLUDE_ATAK=1
  -D MESHTASTIC_EXCLUDE_CANNEDMESSAGES=1
  -D MESHTASTIC_EXCLUDE_INPUTBROKER=1
  -D MESHTASTIC_EXCLUDE_SERIAL=1
  -D MESHTASTIC_EXCLUDE_WAYPOINT=1
  -D MESHTASTIC_EXCLUDE_WEBSERVER=1
  -D default_map_publish_interval_secs=300
